[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-3mlp-ensemble"
version = "0.1.0"
description = "A portable ESM2, SaProt-ProstT5 and ProtBERT MLP ensemble for AMP classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
extract = [
  "transformers==4.42.3",
  "huggingface-hub>=0.23,<1",
  "sentencepiece>=0.2",
]

[project.scripts]
amp-ensemble = "amp_ensemble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
